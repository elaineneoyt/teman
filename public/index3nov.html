<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: near-black ink, one thin line of light that pulses at the feeling's tempo. Single column, lots of air. */
  --ink:#0B0B0E;
  --paper:#EDE8DF;
  --muted:rgba(237,232,223,.64);
  --faint:rgba(237,232,223,.38);
  --line:rgba(237,232,223,.13);
  --a:#EDE8DF;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) max(22px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 48px) max(22px,env(safe-area-inset-left))}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--a);outline-offset:4px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:28px;line-height:1;text-decoration:none}
nav{display:flex;gap:18px;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
nav a{text-decoration:none;color:var(--faint)}
nav a[aria-current="page"]{color:var(--paper)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--faint)}
h1,h2{font-weight:400;text-wrap:balance;margin:0}
.hero{font-family:var(--display);font-size:clamp(46px,13vw,76px);line-height:.96;letter-spacing:-.015em;margin-top:27vh}
.nudge{margin:18px 0 0;color:var(--muted);font-size:15px}
.nudge a{font-family:var(--display);font-style:italic;font-size:22px;color:var(--paper);text-decoration:none;border-bottom:1px solid var(--a)}
.toggle{display:flex;gap:6px;margin-top:40px}
.toggle button{font-family:var(--mono);font-size:12px;background:none;border:1px solid var(--line);color:var(--faint);padding:6px 12px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{color:var(--paper);border-color:var(--faint)}
.group{margin-top:36px}
.group h2{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.group h2 span{color:var(--faint)}
.rows{display:grid}
.row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:12px;text-decoration:none;padding:10px 0;border-bottom:1px solid var(--line)}
.row b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;color:var(--c)}
.row small{display:block;font-size:13px;color:var(--faint);font-style:italic;margin-top:2px}
.row .bpm{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.row .bpm i{display:block;font-style:normal;height:2px;margin-top:6px;background:var(--c);opacity:.7}
.row:hover b{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.back{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--faint);text-decoration:none;margin-top:28px}
.mtop{margin-top:22vh}
.mname{font-family:var(--display);font-size:clamp(58px,17vw,108px);line-height:.92;letter-spacing:-.015em;margin-top:8px;color:var(--paper)}
.local{font-family:var(--display);font-style:italic;font-size:24px;color:var(--a);margin:6px 0 0}
.moment{font-family:var(--display);font-size:25px;line-height:1.28;margin:28px 0 0;max-width:26ch}
.tempo{margin-top:30px;display:grid;gap:8px}
.tempo-read{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--paper)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a)}
.scale{position:relative;height:16px}
.scale::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line)}
.scale span{position:absolute;top:2px;width:2px;height:12px;background:var(--a);transform:translateX(-1px)}
.scale-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
.meta{margin:22px 0 0;color:var(--muted);font-size:14px;display:grid;gap:4px}
.meta b{font-weight:500;color:var(--paper)}
.sec{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted);margin:48px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.set{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:10px;background:linear-gradient(var(--ink),var(--ink)) padding-box;background-color:rgba(11,11,14,.72)}
.set-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.who{font-family:var(--display);font-size:25px;line-height:1.1}
.who span{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px;letter-spacing:.02em}
.sbpm{font-family:var(--mono);font-size:12px;color:var(--paper);white-space:nowrap;text-align:right}
.sbpm em{display:block;font-style:normal;color:var(--faint);font-size:11px}
.bars{display:flex;align-items:center;gap:2px;height:26px;color:var(--a)}
.bars i{flex:1;max-width:4px;background:currentColor;border-radius:1px;opacity:.85;transform-origin:center;animation:kick var(--beat) cubic-bezier(.2,.7,.3,1) infinite;animation-delay:calc(var(--d) * -1s)}
@keyframes kick{0%{transform:scaleY(1)}55%{transform:scaleY(.32)}100%{transform:scaleY(.32)}}
.sound{margin:0;font-size:15px}
.where{margin:0;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.02em}
.go{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;text-decoration:none;padding:9px 14px;border-radius:999px;border:1px solid var(--a);color:var(--paper)}
.go:hover{background:rgba(237,232,223,.06)}
.empty{padding:18px 0;color:var(--muted);border-bottom:1px solid var(--line)}
.drift{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{font-size:14px;text-decoration:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);color:var(--paper)}
.chip i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:4px}
.cta{margin-top:40px;font-size:15px;color:var(--muted)}
.prose{max-width:58ch}
.prose h1{font-family:var(--display);font-size:clamp(40px,10vw,60px);line-height:1;margin-top:27vh}
.prose h2{font-family:var(--display);font-size:27px;margin:36px 0 8px}
.prose p,.prose li{color:var(--muted)}
.prose strong{color:var(--paper);font-weight:500}
.prose ul{padding-left:18px}
form{display:grid;gap:18px;margin-top:24px}
label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
input[type=text],input[type=url],select,textarea{font:inherit;color:var(--paper);background:rgba(11,11,14,.8);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
select option,select optgroup{background:#18171c;color:var(--paper)}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--a)}
.err{color:#FFB4A8;font-size:13px;min-height:1em;margin:0}
.btn{font:inherit;font-weight:600;cursor:pointer;justify-self:start;padding:12px 20px;border-radius:999px;border:none;background:var(--paper);color:var(--ink)}
.note{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.note[hidden]{display:none}
footer{margin-top:72px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--faint)}
.view{animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.bars i{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
html{overflow-x:hidden}
.scene{position:relative;width:100vw;margin-left:calc(50% - 50vw);height:30vh;min-height:200px;overflow:hidden;touch-action:pan-y;cursor:crosshair}
.scene canvas{position:absolute;inset:0;display:block}
.scene.big{height:50vh;min-height:330px;margin-top:10px}
.hint{position:absolute;right:max(22px,calc(50vw - 288px));top:12px;z-index:2;font-family:var(--mono);font-size:11px;color:var(--faint);pointer-events:none;letter-spacing:.02em}
.door{position:absolute;z-index:2;text-decoration:none;font-family:var(--display);font-size:21px;line-height:1;padding:9px 14px 10px;border-radius:999px;color:var(--paper);background:rgba(11,11,14,.55);border:1px solid var(--c);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:float 7s ease-in-out infinite;animation-delay:var(--dl);white-space:nowrap}
.door i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--faint);display:block;margin-top:4px}
.door:hover{background:rgba(11,11,14,.8)}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(6px,-9px)}66%{transform:translate(-5px,5px)}}
.mtop{margin-top:4px}
.hero{margin-top:2vh}
.prose h1{margin-top:2vh}
.pvbtn{font:inherit;font-size:14px;cursor:pointer;justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--paper)}
.pvbtn:hover{border-color:var(--a)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pv{display:grid;gap:8px}
.pv iframe{width:100%;border:0;border-radius:8px;background:#000}
.pv .yt{aspect-ratio:16/9}
.pv .sc{height:120px;background:none}
.pvbar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.pvbar i{display:block;height:100%;width:0;background:var(--a)}
.pvnote{font-family:var(--mono);font-size:11px;color:var(--faint);margin:0}
.set:hover .who{color:var(--a)}
@media (prefers-reduced-motion:reduce){.door{animation:none}}
.scene.flow{height:56vh;min-height:380px}
.scene.field{height:auto;min-height:86vh;cursor:default;padding-bottom:12vh}
.fwrap{position:relative;z-index:2;max-width:620px;margin:0 auto;padding:6vh 22px 0}
.fwrap .hero{margin-top:0}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:14px 20px;margin-top:5vh;padding:0 4px}
.w{display:inline-block;text-decoration:none;color:var(--c);font-family:var(--display);font-size:var(--fs);line-height:1.05;animation:float var(--fl) ease-in-out infinite;animation-delay:var(--dl);transition:opacity .45s,filter .45s}
.w span{display:inline-block;animation:thump var(--beat) cubic-bezier(.2,.7,.3,1) infinite;transform-origin:center}
.w:hover span,.w:focus-visible span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.w.now{text-shadow:0 0 22px var(--c),0 0 4px var(--c)}
.w.now sup{font-family:var(--mono);font-size:10px;color:var(--paper);margin-left:4px;letter-spacing:.04em;vertical-align:super}
@keyframes thump{0%{transform:scale(calc(1 + var(--amp)));opacity:1}45%{transform:scale(1);opacity:.72}100%{transform:scale(1);opacity:.72}}
.fhint{text-align:center;margin-top:5vh}
.scene.blooming .cloud .w{opacity:.05;filter:blur(2px)}
.scene.blooming .fwrap>.hero,.scene.blooming .fwrap>.nudge,.scene.blooming .fhint{opacity:0;transition:opacity .4s}
.scene.blooming .w.picked{opacity:0}
.bloom{position:absolute;top:0;left:0;right:0;z-index:3;pointer-events:none}
.bloom[hidden]{display:none}
.bwrap{position:relative;max-width:620px;margin:0 auto;padding:10vh 22px 0;height:100%}
.bname{font-family:var(--display);font-size:clamp(56px,16vw,96px);line-height:.95;color:var(--c);text-shadow:0 0 30px var(--c);animation:bloomin .7s cubic-bezier(.2,.8,.2,1) both}
.blocal{font-family:var(--display);font-style:italic;font-size:22px;color:var(--paper);margin:6px 0 0;animation:fadein .6s .25s both}
.bmoment{font-family:var(--display);font-size:22px;line-height:1.3;color:var(--muted);margin:14px 0 0;max-width:26ch;animation:fadein .6s .4s both}
.bsets{position:absolute;left:22px;right:22px;bottom:16vh;display:flex;flex-wrap:wrap;gap:10px;animation:fadein .6s .9s both}
.bsets .door{position:relative;animation:none;font-size:18px}
.bskip{position:absolute;left:22px;bottom:calc(16vh - 36px);font-family:var(--mono);font-size:11px;color:var(--faint);animation:fadein .4s .6s both}
@keyframes bloomin{from{opacity:0;transform:scale(.7) translateY(20px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.browse{margin-top:6px}
.corder{display:flex;justify-content:center;gap:6px;margin-top:14px}
.corder button{font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--line);color:var(--faint);padding:5px 11px;border-radius:999px;cursor:pointer}
.corder button[aria-pressed="true"]{color:var(--paper);border-color:var(--faint)}
.moments{display:grid;margin-top:4px}
.mo{display:block;text-decoration:none;padding:18px 0;border-bottom:1px solid var(--line)}
.mo q{display:block;font-family:var(--display);font-size:25px;line-height:1.25;color:var(--paper);quotes:none}
.mo span{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.02em}
.mo span b{font-weight:400;color:var(--c)}
.mo span i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.mo:hover q{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.more-m{font:inherit;font-family:var(--mono);font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;margin-top:18px}
@media (prefers-reduced-motion:reduce){.w,.w span{animation:none}}
.fcap{position:absolute;left:max(22px,calc(50vw - 288px));top:12px;z-index:2;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.02em;pointer-events:none}
.fsrc{position:absolute;z-index:2;left:max(22px,calc(50vw - 288px));right:max(22px,calc(50vw - 288px));top:13%;text-decoration:none;display:block;transition:opacity .5s}
.fsrc b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(30px,8.5vw,44px);line-height:1}
.fsrc i{display:block;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px;letter-spacing:.02em}
.fdst{position:absolute;z-index:2;left:max(22px,calc(50vw - 288px));right:max(22px,calc(50vw - 288px));bottom:20%;display:flex;flex-wrap:wrap;gap:12px 10px;transition:opacity .5s}
.fdst .door{position:relative;animation-duration:9s}
.fade{opacity:0}
.fnext{position:absolute;z-index:2;right:max(22px,calc(50vw - 288px));top:9px;font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.facts li{display:grid;grid-template-columns:28px 64px 1fr;gap:8px;align-items:baseline;font-size:15px}
.facts .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.facts .k{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.feels{display:flex;flex-wrap:wrap;gap:6px}
.feels a{font-size:13px;text-decoration:none;padding:3px 9px;border-radius:999px;border:1px solid var(--c);color:var(--paper)}
.feels a[aria-current="true"]{background:var(--c);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:14px}
.tags span+span::before{content:"·";margin-right:6px;color:var(--faint)}
.ear{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--faint);align-self:center;margin-left:4px}
details.more{border-top:1px dashed var(--line);padding-top:9px}
details.more summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";justify-self:end;grid-column:2;margin-top:-15px}
details.more[open] summary::after{content:"–"}
details.more .cult{margin:8px 0 0 36px;font-size:15px;color:var(--paper)}
details.more .where{margin:6px 0 0 36px}
.narrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.narrow span{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:4px}
.narrow button{font:inherit;font-size:13px;cursor:pointer;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted)}
.narrow button[aria-pressed="true"]{border-color:var(--a);color:var(--paper)}
.set[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="#feelings">Teman</a>
    <nav aria-label="Main">
      <a href="#feelings" data-nav="feelings">feelings</a>
      <a href="#suggest" data-nav="suggest">suggest a set</a>
      <a href="#why" data-nav="why">why</a>
    </nav>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>Teman · a listening map of Southeast Asian selectors<br>No plays, no charts, no follower counts. Tempos are estimates.</footer>
</div>
