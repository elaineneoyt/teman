<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: near-black ink, one thin line of light that pulses at the feeling's tempo. Single column, lots of air. */
  --ink:#0B0B0E;
  --paper:#EDE8DF;
  --muted:rgba(237,232,223,.64);
  --faint:rgba(237,232,223,.38);
  --line:rgba(237,232,223,.13);
  --a:#EDE8DF;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) max(22px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 48px) max(22px,env(safe-area-inset-left))}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--a);outline-offset:4px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:28px;line-height:1;text-decoration:none}
nav{display:flex;gap:18px;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
nav a{text-decoration:none;color:var(--faint)}
nav a[aria-current="page"]{color:var(--paper)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--faint)}
h1,h2{font-weight:400;text-wrap:balance;margin:0}
.hero{font-family:var(--display);font-size:clamp(46px,13vw,76px);line-height:.96;letter-spacing:-.015em;margin-top:27vh}
.nudge{margin:18px 0 0;color:var(--muted);font-size:15px}
.nudge a{font-family:var(--display);font-style:italic;font-size:22px;color:var(--paper);text-decoration:none;border-bottom:1px solid var(--a)}
.toggle{display:flex;gap:6px;margin-top:40px}
.toggle button{font-family:var(--mono);font-size:12px;background:none;border:1px solid var(--line);color:var(--faint);padding:6px 12px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{color:var(--paper);border-color:var(--faint)}
.group{margin-top:36px}
.group h2{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.group h2 span{color:var(--faint)}
.rows{display:grid}
.row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:12px;text-decoration:none;padding:10px 0;border-bottom:1px solid var(--line)}
.row b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;color:var(--c)}
.row small{display:block;font-size:13px;color:var(--faint);font-style:italic;margin-top:2px}
.row .bpm{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.row .bpm i{display:block;font-style:normal;height:2px;margin-top:6px;background:var(--c);opacity:.7}
.row:hover b{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.back{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--faint);text-decoration:none;margin-top:28px}
.mtop{margin-top:22vh}
.mname{font-family:var(--display);font-size:clamp(58px,17vw,108px);line-height:.92;letter-spacing:-.015em;margin-top:8px;color:var(--paper)}
.local{font-family:var(--display);font-style:italic;font-size:24px;color:var(--a);margin:6px 0 0}
.moment{font-family:var(--display);font-size:25px;line-height:1.28;margin:28px 0 0;max-width:26ch}
.tempo{margin-top:30px;display:grid;gap:8px}
.tempo-read{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--paper)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a)}
.scale{position:relative;height:16px}
.scale::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line)}
.scale span{position:absolute;top:2px;width:2px;height:12px;background:var(--a);transform:translateX(-1px)}
.scale-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
.meta{margin:22px 0 0;color:var(--muted);font-size:14px;display:grid;gap:4px}
.meta b{font-weight:500;color:var(--paper)}
.sec{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted);margin:48px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.set{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:10px;background:linear-gradient(var(--ink),var(--ink)) padding-box;background-color:rgba(11,11,14,.72)}
.set-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.who{font-family:var(--display);font-size:25px;line-height:1.1}
.who span{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px;letter-spacing:.02em}
.sbpm{font-family:var(--mono);font-size:12px;color:var(--paper);white-space:nowrap;text-align:right}
.sbpm em{display:block;font-style:normal;color:var(--faint);font-size:11px}
.bars{display:flex;align-items:center;gap:2px;height:26px;color:var(--a)}
.bars i{flex:1;max-width:4px;background:currentColor;border-radius:1px;opacity:.85;transform-origin:center;animation:kick var(--beat) cubic-bezier(.2,.7,.3,1) infinite;animation-delay:calc(var(--d) * -1s)}
@keyframes kick{0%{transform:scaleY(1)}55%{transform:scaleY(.32)}100%{transform:scaleY(.32)}}
.sound{margin:0;font-size:15px}
.where{margin:0;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.02em}
.go{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;text-decoration:none;padding:9px 14px;border-radius:999px;border:1px solid var(--a);color:var(--paper)}
.go:hover{background:rgba(237,232,223,.06)}
.empty{padding:18px 0;color:var(--muted);border-bottom:1px solid var(--line)}
.drift{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{font-size:14px;text-decoration:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);color:var(--paper)}
.chip i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:4px}
.cta{margin-top:40px;font-size:15px;color:var(--muted)}
.prose{max-width:58ch}
.prose h1{font-family:var(--display);font-size:clamp(40px,10vw,60px);line-height:1;margin-top:27vh}
.prose h2{font-family:var(--display);font-size:27px;margin:36px 0 8px}
.prose p,.prose li{color:var(--muted)}
.prose strong{color:var(--paper);font-weight:500}
.prose ul{padding-left:18px}
form{display:grid;gap:18px;margin-top:24px}
label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
input[type=text],input[type=url],select,textarea{font:inherit;color:var(--paper);background:rgba(11,11,14,.8);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
select option,select optgroup{background:#18171c;color:var(--paper)}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--a)}
.err{color:#FFB4A8;font-size:13px;min-height:1em;margin:0}
.btn{font:inherit;font-weight:600;cursor:pointer;justify-self:start;padding:12px 20px;border-radius:999px;border:none;background:var(--paper);color:var(--ink)}
.note{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.note[hidden]{display:none}
footer{margin-top:72px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--faint)}
.view{animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.bars i{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
html{overflow-x:hidden}
.scene{position:relative;width:100vw;margin-left:calc(50% - 50vw);height:30vh;min-height:200px;overflow:hidden;touch-action:pan-y;cursor:crosshair}
.scene canvas{position:absolute;inset:0;display:block}
.scene.big{height:50vh;min-height:330px;margin-top:10px}
.hint{position:absolute;right:max(22px,calc(50vw - 288px));top:12px;z-index:2;font-family:var(--mono);font-size:11px;color:var(--faint);pointer-events:none;letter-spacing:.02em}
.door{position:absolute;z-index:2;text-decoration:none;font-family:var(--display);font-size:21px;line-height:1;padding:9px 14px 10px;border-radius:999px;color:var(--paper);background:rgba(11,11,14,.55);border:1px solid var(--c);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:float 7s ease-in-out infinite;animation-delay:var(--dl);white-space:nowrap}
.door i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--faint);display:block;margin-top:4px}
.door:hover{background:rgba(11,11,14,.8)}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(6px,-9px)}66%{transform:translate(-5px,5px)}}
.mtop{margin-top:4px}
.hero{margin-top:2vh}
.prose h1{margin-top:2vh}
.pvbtn{font:inherit;font-size:14px;cursor:pointer;justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--paper)}
.pvbtn:hover{border-color:var(--a)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pv{display:grid;gap:8px}
.pv iframe{width:100%;border:0;border-radius:8px;background:#000}
.pv .yt{aspect-ratio:16/9}
.pv .sc{height:120px;background:none}
.pvbar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.pvbar i{display:block;height:100%;width:0;background:var(--a)}
.pvnote{font-family:var(--mono);font-size:11px;color:var(--faint);margin:0}
.set:hover .who{color:var(--a)}
@media (prefers-reduced-motion:reduce){.door{animation:none}}
</style>
</head>

    slot.innerHTML = `<div class="pv"><iframe class="sc" title="30-second preview of ${esc(s.n)}" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(u)}&color=%23${col}&auto_play=false&visual=false&hide_related=true&show_comments=false&show_reposts=false&show_teaser=false"></iframe><div class="pvbar"><i></i></div><p class="pvnote">loading…</p></div>`;
    const fr = slot.querySelector("iframe");
    loadSC().then(SC => {
      const w = SC.Widget(fr); let started = false;
      w.bind(SC.Widget.Events.READY, () => w.getDuration(d => { w.seekTo(Math.min(st * 1000, d * .25)); w.play(); }));
      w.bind(SC.Widget.Events.PLAY, () => { if (!started) { started = true; runClock(slot, s, () => { try { w.pause(); } catch {} done(); }); } });
      setTimeout(() => { if (!started && pvOpen && pvOpen.slot === slot) slot.querySelector(".pvnote").textContent = "press play on the player to start the preview"; }, 3500);
    }).catch(() => { slot.querySelector(".pvnote").textContent = "the SoundCloud player didn't load. Use the link instead."; });
  }
}
function wirePreviews(m){
  app.querySelectorAll("[data-pv]").forEach(b => b.addEventListener("click", () => openPreview(b, SETS[+b.dataset.pv])));
}
function mood(m){
  stopPreview();
  const prim = shuffle(SETS.filter(s => s.p === m.id));
  const also = shuffle(SETS.filter(s => s.p !== m.id && s.also.includes(m.id))).slice(0, 6);
  const g = BY[m.gd], x = BY[m.st], G = GBY[m.g];
  app.innerHTML = `<section class="view">
    <a class="back" href="#feelings">← all feelings</a>
    <div class="scene big" id="sc" aria-label="A moving picture of ${esc(m.n)}, pulsing at about ${m.bpm} beats per minute. Tap it.">
      <span class="hint">tap anywhere · ${m.bpm} bpm</span>
      ${doors(m)}
    </div>
    <div class="mtop">
      <p class="mono">${esc(G.n)} · ${esc(G.ax)}</p>
      <h1 class="mname">${esc(m.n)}</h1>
      <p class="local">${esc(m.l)}</p>
      <p class="moment">${esc(m.m)}</p>
      <div class="tempo" aria-label="Typical tempo about ${m.bpm} beats per minute">
        <div class="tempo-read"><span class="dot" id="beatdot"></span>≈ ${m.bpm} bpm</div>
        <div class="scale"><span style="left:${pos(m.bpm)}%"></span></div>
        <div class="scale-l"><span>slow · ${BMIN}</span><span>fast · ${BMAX}</span></div>
      </div>
      <div class="meta"><span>Often around <b>${esc(m.t)}</b></span><span>Sounds that live here: <b>${esc(m.s)}</b></span></div>
    </div>
    <h2 class="sec">carried by</h2>
    ${prim.length ? prim.map(s => card(s, m)).join("")
      : `<div class="empty">Nobody carries this feeling as their main one yet. <a href="#suggest" data-mood="${m.id}">Know a set that sits with it?</a></div>`}
    ${also.length ? `<h2 class="sec">also holds this feeling</h2>${also.map(s => card(s, m)).join("")}` : ""}
    <h2 class="sec">drift to</h2>
    <div class="drift">
      <a class="chip" href="#${g.id}">${esc(g.n)}<i>gently · ${g.bpm}</i></a>
      <a class="chip" href="#${x.id}">${esc(x.n)}<i>a stretch · ${x.bpm}</i></a>
    </div>
    <p class="cta">Know a set that feels like this? <a href="#suggest" data-mood="${m.id}">Suggest it</a>.</p>
  </section>`;
  mountScene(document.getElementById("sc"), {bpm: m.bpm, col: m.col, kick: kickFor(m), kind: KIND[m.id] || "wave"});
  wirePreviews(m);
  const dot = document.getElementById("beatdot");
  if (dot && !still && dot.animate) dot.animate([{transform:"scale(1.6)", opacity:1}, {transform:"scale(1)", opacity:.45}], {duration: 60000 / m.bpm, iterations: Infinity, easing: "ease-out"});
}
let preMood = "";
function suggest(){
  const opts = GROUPS.map(g => `<optgroup label="${esc(g.n)}">${M.filter(m => m.g === g.k).map(m => `<option value="${m.id}"${m.id === preMood ? " selected" : ""}>${esc(m.n)} (${esc(m.l)})</option>`).join("")}</optgroup>`).join("");
  app.innerHTML = `<section class="view prose">
    <div class="scene" id="sc"></div>
    <h1>Suggest a set</h1>
    <p>Tell us how it feels, not what genre it is. Two people listen to every suggestion before it goes up. More nominations never move a set up the page, so one is enough.</p>
    <form id="sform" novalidate>
      <label for="f-url">Link to the set (YouTube or SoundCloud)
        <input type="url" id="f-url" placeholder="https://soundcloud.com/…" autocomplete="off"></label>
      <label for="f-who">Selector name and city
        <input type="text" id="f-who" placeholder="dan, Singapore"></label>
      <label for="f-mood">The feeling
        <select id="f-mood"><option value="">Choose one</option>${opts}</select></label>
      <label for="f-moment">The moment, in your words
        <textarea id="f-moment" placeholder="Deep work, too many tabs open"></textarea></label>
      <label for="f-time">Where the feeling is strongest, and the tempo if you know it (optional)
        <input type="text" id="f-time" placeholder="from 23:10, about 124 bpm"></label>
      <label class="check" for="f-ok"><input type="checkbox" id="f-ok"> I'm the selector, or I'll check they're happy to be featured.</label>
      <p class="err" id="f-err" role="alert"></p>
      <button class="btn" type="submit">Send suggestion</button>
    </form>
    <div class="note" id="f-done" hidden></div>
  </section>`;
  mountScene(document.getElementById("sc"), {bpm: 96, col: "#EDE8DF", kick: .3, kind: "wave"});
  document.getElementById("sform").addEventListener("submit", onSubmit);
  ["f-url","f-who","f-mood","f-moment","f-ok"].forEach(id => document.getElementById(id).addEventListener("input", () => { document.getElementById("f-err").textContent = ""; }));
}
async function onSubmit(e){
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById("f-err");
  const url = v("f-url"), who = v("f-who"), md = v("f-mood"), mo = v("f-moment"), tm = v("f-time"), ok = document.getElementById("f-ok").checked;
  if (!/^https?:\/\/\S+\.\S+/.test(url)) { err.textContent = "Add a full link that starts with https://"; return; }
  if (!/(youtube\.com|youtu\.be|soundcloud\.com)/i.test(url)) { err.textContent = "Teman only links to YouTube or SoundCloud. Add a link from one of those."; return; }
  if (who.length < 2) { err.textContent = "Add the selector's name and city."; return; }
  if (!md) { err.textContent = "Choose the feeling this set carries."; return; }
  if (mo.length < 8) { err.textContent = "Describe the moment in a few words. That's how we tag it."; return; }
  if (!ok) { err.textContent = "Tick the box to confirm the selector is happy to be featured."; return; }
  const item = {url, who, mood: md, moment: mo, time: tm, at: new Date().toISOString()};
  const done = document.getElementById("f-done");
  if (await saveSuggestion(item)) {
    done.innerHTML = `<p><strong>Saved to the listening queue.</strong> Thanks for carrying it here.</p>`;
    document.getElementById("sform").reset();
  } else {
    const text = `Teman suggestion\nSet: ${url}\nSelector: ${who}\nFeeling: ${BY[md].n}\nMoment: ${mo}${tm ? "\nNotes: " + tm : ""}`;
    done.innerHTML = `<p><strong>Almost there.</strong> This page can't store suggestions for you yet, so copy it and send it ${CONTACT ? "to " + esc(CONTACT) : "to whoever shared this page with you"}.</p>
      <label for="f-copy" class="sr">Your suggestion</label><textarea id="f-copy" readonly>${esc(text)}</textarea>
      <p><button class="btn" type="button" id="f-copybtn">Copy suggestion</button> <span id="f-copied" class="mono"></span></p>`;
    document.getElementById("f-copybtn").addEventListener("click", async () => {
      const out = document.getElementById("f-copied");
      try { await navigator.clipboard.writeText(text); out.textContent = "copied"; }
      catch { document.getElementById("f-copy").select(); out.textContent = "select the text above and copy it"; }
    });
  }
  done.hidden = false;
}
let capsP = null;
function caps(){
  if (!capsP) capsP = (async () => {
    try {
      if (!window.claude || !window.claude.use) return null;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return null;
      const id = await user.id();
      return id ? {db, id} : null;
    } catch { return null; }
  })();
  return capsP;
}
async function saveSuggestion(item){
  try {
    const c = await caps(); if (!c) return false;
    const ref = c.db.doc("queue/" + c.id);
    const snap = await ref.get();
    const items = snap.exists && Array.isArray(snap.data().items) ? snap.data().items.slice(-29) : [];
    items.push(item);
    await ref.set({items, updatedAt: item.at});
    return true;
  } catch { return false; }
}
function why(){
  app.innerHTML = `<section class="view prose">
    <div class="scene" id="sc"></div>
    <h1>Why Teman sounds like this</h1>
    <p><em>Teman</em> means companion in Malay.Some of the best DJ sets I heard this year were played to a room of about eleven people.

Southeast Asia has a deep bench of selectors putting out brilliant sets on community radio. Most reach a few hundred listeners, because the big platforms reward what’s already popular.

With Teman, you pick how you feel, from deep work to table dancing, and it surfaces sets by Southeast Asian selectors, linking straight to the full set on YouTube or SoundCloud so the plays go to the artist.</p>
    <h2>Feelings, not genres</h2>
    <p>You come in through a feeling you know and leave with a sound you didn't. Every feeling holds many genres, so your taste stretches without you having to try.</p>
    <h2>Tempo, not popularity</h2>
    <p>The line on every page moves at that feeling's pace, and every set shows roughly how fast it goes, so you can tell a slow burn from a peak-time set before you press play. Tempos are estimates from the genres each set describes, not measurements. They get corrected as people listen.</p>
    <h2>No plays, no charts</h2>
    <ul>
      <li><strong>Nothing is sorted by popularity.</strong> The order shuffles every time you open a feeling.</li>
      <li><strong>No play counts or follower numbers</strong> appear anywhere.</li>
      <li><strong>Every link goes straight to the set</strong> on YouTube or SoundCloud, so the listening and the following land with the selector.</li>
    </ul>
    <h2>How a set gets in</h2>
    <ul>
      <li>The selector is from or based in Southeast Asia, and the set is public on YouTube or SoundCloud.</li>
      <li>It's a real mix with craft in it, not a playlist.</li>
      <li>Someone names the feeling and the moment it belongs to.</li>
      <li>Two people listen separately and agree on where it sits.</li>
      <li>The selector is happy to be here.</li>
    </ul>
    <h2>Early days</h2>
    <p>The first map was built from how each set describes itself. Some tags are first guesses that still need a proper listen. If one feels wrong, <a href="#suggest">tell us</a>.</p>
  </section>`;
  mountScene(document.getElementById("sc"), {bpm: 80, col: "#EDE8DF", kick: .2, kind: "wave"});
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll("nav a").forEach(a => a.removeAttribute("aria-current"));
  const navKey = h === "suggest" || h === "why" ? h : "feelings";
  document.querySelector(`nav a[data-nav="${navKey}"]`).setAttribute("aria-current", "page");
  stopPreview();
  if (BY[h]) mood(BY[h]); else if (h === "suggest") suggest(); else if (h === "why") why(); else home();
  scrollTo({top: 0, behavior: "auto"});
}
document.addEventListener("click", e => { const a = e.target.closest("a[data-mood]"); if (a) preMood = a.dataset.mood; else if (e.target.closest('a[href="#suggest"]')) preMood = ""; });
addEventListener("hashchange", route);
route();
</script>
